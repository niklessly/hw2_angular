<div class="todo-item" [ngClass]="todo.status">
    <div *ngIf="!isEditing; else editTemplate" class="view-mode">
        <input type="checkbox" [checked]="todo.status === 'done'" (change)="onStatusChange('done')"
            [disabled]="todo.status === 'deleted'">

        <span class="todo-title" [ngClass]="{
        'completed': todo.status === 'done',
        'deleted': todo.status === 'deleted'
      }">
            {{ todo.title }}
        </span>

        <div class="actions">
            <button *ngIf="todo.status === 'active' || todo.status === 'done'" (click)="startEdit()" class="edit-btn">
                ✏️
            </button>

            <button *ngIf="todo.status === 'active' || todo.status === 'done'" (click)="onArchive()"
                class="archive-btn">
                📦
            </button>

            <button *ngIf="todo.status === 'deleted' || todo.status === 'archived'" (click)="onRestore()"
                class="restore-btn">
                ↩️
            </button>

            <button *ngIf="todo.status !== 'deleted' && todo.status !== 'archived'" (click)="onDelete()"
                class="delete-btn">
                🗑️
            </button>
        </div>
    </div>

    <ng-template #editTemplate>
        <div class="edit-mode">
            <input [(ngModel)]="editedTitle" (keyup.enter)="saveEdit()" (keyup.escape)="cancelEdit()" class="edit-input"
                autofocus>
            <div class="edit-actions">
                <button (click)="saveEdit()" [disabled]="!editedTitle.trim()">💾</button>
                <button (click)="cancelEdit()">❌</button>
            </div>
        </div>
    </ng-template>
</div>
