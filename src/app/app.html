<div class="todo-app">
  <h1>📝 Todo List</h1>

  <div class="add-todo">
    <input [(ngModel)]="newTodoTitle" (keyup.enter)="addTodo()" placeholder="Что нужно сделать?" class="todo-input">
    <button (click)="addTodo()" class="add-btn">Добавить</button>
  </div>

  <div class="todo-list">
    <app-todo-item *ngFor="let todo of todos" [todo]="todo" (statusChange)="handleStatusChange($event)"
      (delete)="handleDelete($event)" (restore)="handleRestore($event)"></app-todo-item>
  </div>
</div>
